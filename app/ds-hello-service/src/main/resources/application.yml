spring:
  application:
    name: ds-hello-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dsapp}
    username: ${DB_USERNAME:dsadmin}
    password: ${DB_PASSWORD:localpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      # ← add this — don't fail on startup if DB is unavailable
      initialization-fail-timeout: -1

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      # ← add this — exclude DB from health check
      probes:
        enabled: true
  health:
    db:
      enabled: false # ← don't fail health check if DB unavailable
  server:
    port: 8080

logging:
  level:
    root: INFO
    com.ds: DEBUG
