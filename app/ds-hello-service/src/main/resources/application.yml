spring:
  application:
    name: ds-hello-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dsapp}
    username: ${DB_USERNAME:dsadmin}
    password: ${DB_PASSWORD:localpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000    # fail fast if DB unreachable
      maximum-pool-size: 5

server:
  port: 8080
  shutdown: graceful

# ALB health check endpoint
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  server:
    port: 8080

logging:
  level:
    root: INFO
    com.ds: DEBUG
